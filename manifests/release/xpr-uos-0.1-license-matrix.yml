release_options:
  source_metadata:
    safe_now: true
    includes:
      - repository source
      - docs
      - manifests
      - build scripts
      - sanitized smoke-test evidence
    excludes:
      - rootfs images
      - MPSS payloads
      - uncertain binary packages
  byo_mpss_builder:
    recommended_first_usable_release: true
    includes:
      - public build orchestration
      - local MPSS input validation
      - local-only rootfs generation
      - reversible MicDir boot script
  prebuilt_binary_rootfs:
    safe_now: false
    blockers:
      - remove Python 3.5 legacy payload
      - rebuild or replace BusyBox
      - rebuild/trace all runtime libraries
      - include source and license bundles for GPL/LGPL/permissive components
      - prove no Intel MPSS payloads are included
      - human legal review
