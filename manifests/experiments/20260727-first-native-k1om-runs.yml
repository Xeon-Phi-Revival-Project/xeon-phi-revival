notes:
  - The native run harness now enforces timeout on the CentOS host side because
    the stock MIC uOS does not provide a timeout command.
  - Direct k1om-mpss-linux-as produced an ordinary x86-64 object for the first
    x86-looking assembly test; the validated assembly path is the GCC driver
    followed by the K1OM linker.
  - The harness now validates K1OM binaries with readelf Machine output instead
    of relying on file output text or path names.
next_dependency: Python and Doom feasibility lanes
